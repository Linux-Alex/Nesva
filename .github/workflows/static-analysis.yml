name: Static analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clang-tidy:
    name: clang-tidy (nesva-core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy libgl1-mesa-dev

      - name: Configure with compile commands
        run: cmake --preset linux-debug -DNESVA_WARNINGS_AS_ERRORS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Generate compile_commands.json
        run: cmake --build --preset linux-debug --target nesva_core

      - name: Run clang-tidy over core sources
        run: |
          set -euo pipefail
          files=$(find src/core src/database -name '*.cpp' | sort)
          echo "$files"
          clang-tidy -p build/linux-debug --quiet $files