name: Static analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clang-tidy:
    name: clang-tidy (nesva-core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy \
            qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite libgl1-mesa-dev

      - name: Configure with compile commands
        run: cmake --preset linux-debug -DNESVA_WARNINGS_AS_ERRORS=OFF

      - name: Generate compile_commands.json
        run: cmake --build --preset linux-debug --target nesva_core

      - name: Run clang-tidy over core sources
        run: |
          set -euo pipefail
          files=$(find src/core src/database -name '*.cpp' | sort)
          echo "$files"
          clang-tidy -p build/linux-debug --quiet $files
