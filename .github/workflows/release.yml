name: Release

# Tag push (v*) builds, tests, packages and publishes a GitHub release.
# Manual dispatch builds the same artifacts without publishing, so a candidate
# can be inspected before anything is tagged.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release for this commit'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: '6.10.2'

jobs:
  linux:
    name: Linux x86_64 package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the embedded commit

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libgl1-mesa-dev ccache

      - name: Configure
        run: cmake --preset linux-release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DNESVA_EMBED_GIT_COMMIT=ON

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        run: ctest --preset linux-release --output-on-failure

      - name: Package (.deb and portable tarball)
        # Both generators stage the same install tree, which is where the Qt
        # runtime is bundled (cmake/DeployQtRuntime.cmake.in). The flag turns a
        # failed bundling into a build error instead of a package that installs
        # and then cannot start.
        env:
          NESVA_REQUIRE_QT_BUNDLE: '1'
        run: |
          cd build/linux-release
          cpack
          echo "--- packaged tree ---"
          tar tzf nesva-*-linux-x86_64.tar.gz | head -30

      - name: Checksums
        run: |
          cd build/linux-release
          sha256sum *.deb *.tar.gz > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Smoke-test the tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tar-check"
          tar -C "$RUNNER_TEMP/tar-check" -xzf build/linux-release/nesva-*.tar.gz --strip-components=1
          # Prove the package carries its own Qt: the binaries must resolve Qt from
          # lib/nesva, not from whatever Qt the runner happens to have. The runner
          # exports LD_LIBRARY_PATH pointing at its own Qt, which a bundled package
          # has to ignore.
          env -u LD_LIBRARY_PATH ldd "$RUNNER_TEMP/tar-check/bin/nesva" \
            | grep -q "lib/nesva/libQt6Core.so.6"
          # Nothing may be unresolved: an earlier build shipped a Qt that needed a
          # libicu the distribution does not have, and only failed at startup.
          if env -u LD_LIBRARY_PATH ldd "$RUNNER_TEMP"/tar-check/bin/* \
               | grep -q "not found"; then
            echo "unresolved shared libraries:" >&2
            env -u LD_LIBRARY_PATH ldd "$RUNNER_TEMP"/tar-check/bin/* | grep "not found" >&2
            exit 1
          fi
          "${RUNNER_TEMP}/tar-check/bin/nesva-cli" --version
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/tar-check/bin/nesva" \
            --data-dir="$RUNNER_TEMP/tar-check/data" \
            --gui-selftest="$RUNNER_TEMP/tar-check/shots" --no-console-log

      - name: Report the packaged dependencies
        run: |
          cd build/linux-release
          dpkg-deb -f *.deb Depends | tr ',' '\n' | sed 's/^ *//'

      - uses: actions/upload-artifact@v4
        with:
          name: nesva-linux-x86_64
          path: |
            build/linux-release/*.deb
            build/linux-release/nesva-*.tar.gz
            build/linux-release/SHA256SUMS-linux.txt

  windows:
    name: Windows x86_64 package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-msvc-release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DNESVA_EMBED_GIT_COMMIT=ON

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Test
        run: ctest --preset windows-msvc-release --output-on-failure

      - name: Assemble a runnable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = 'build/windows-msvc-release'
          $version = (Select-String -Path CMakeLists.txt -Pattern '^  VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $stage = Join-Path $env:RUNNER_TEMP 'nesva-windows'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($exe in 'nesva.exe', 'nesva-cli.exe', 'nesva-agent.exe') {
            Copy-Item (Join-Path $build $exe) $stage
          }
          # Qt DLLs and plugins: without this the archive only runs on a machine
          # that already has Qt installed.
          # Keep the compiler runtime and the software OpenGL fallback: the zip must
          # run on a machine without a VC++ redistributable and on a VM or RDP
          # session without a usable GPU.
          foreach ($exe in 'nesva.exe', 'nesva-cli.exe', 'nesva-agent.exe') {
            & windeployqt --release --no-translations (Join-Path $stage $exe)
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for $exe" }
          }

          # windeployqt drops vc_redist.x64.exe, which needs an administrator to
          # install. Ship the CRT DLLs next to the binaries instead: app-local
          # deployment is allowed and needs no rights at all.
          if ($env:VCToolsRedistDir) {
            $crt = Get-ChildItem -Path (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.CRT' |
              Select-Object -First 1
            if ($crt) {
              Copy-Item (Join-Path $crt.FullName '*.dll') $stage
            }
          }
          Get-ChildItem $stage -Filter 'vc_redist*.exe' | Remove-Item -Force
          Copy-Item LICENSE, README.md $stage
          Copy-Item 'packaging/windows/README.md' (Join-Path $stage 'README-windows.md')

          $zip = Join-Path $build "nesva-$version-windows-x86_64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          "NESVA_STAGE=$stage" >> $env:GITHUB_ENV
          "NESVA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The windows-2022 image already has NSIS on PATH; install it only when
          # the image changes. ($env:ProgramFiles(x86) cannot be used directly:
          # PowerShell reads it as a call to a command named x86.)
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis --no-progress -y | Out-Null
            $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          }
          if (-not (Test-Path $makensis)) { throw "makensis not found" }
          Write-Host "using $makensis"
          # Absolute: makensis resolves OutFile against the script's own directory
          # (packaging/windows/), where the build tree does not exist.
          $outFile = Join-Path (Get-Location).Path "build/windows-msvc-release/nesva-$env:NESVA_VERSION-windows-x86_64-setup.exe"
          & $makensis "/DVERSION=$env:NESVA_VERSION" "/DSTAGE=$env:NESVA_STAGE" "/DOUTFILE=$outFile" 'packaging/windows/nesva.nsi'
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          if (-not (Test-Path $outFile)) { throw "the installer was not produced" }
          Get-Item $outFile | Format-List Name, Length

      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Unattended install into a temporary directory, then prove the installed
          # copy runs and that the uninstaller really removes it. Nesva's whole
          # point on Windows is that none of this asks for administrator rights.
          $target = Join-Path $env:RUNNER_TEMP 'installer-check'
          $setup = Join-Path 'build/windows-msvc-release' "nesva-$env:NESVA_VERSION-windows-x86_64-setup.exe"
          Start-Process -FilePath $setup -ArgumentList '/S', "/D=$target" -Wait
          foreach ($required in 'nesva.exe', 'nesva-cli.exe', 'nesva-agent.exe', 'Qt6Core.dll', 'Uninstall.exe') {
            if (-not (Test-Path (Join-Path $target $required))) {
              throw "$required was not installed into $target"
            }
          }
          & (Join-Path $target 'nesva-cli.exe') --version
          $env:QT_QPA_PLATFORM = 'offscreen'
          & (Join-Path $target 'nesva.exe') --data-dir (Join-Path $env:RUNNER_TEMP 'installer-data') --gui-selftest (Join-Path $env:RUNNER_TEMP 'installer-shots') --no-console-log
          if ($LASTEXITCODE -ne 0) { throw "the installed application failed to start" }
          Start-Process -FilePath (Join-Path $target 'Uninstall.exe') -ArgumentList '/S'
          # An NSIS uninstaller relaunches itself from the temp directory and the
          # original process exits immediately, so -Wait is not enough here.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and (Test-Path (Join-Path $target 'nesva.exe'))) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $target 'nesva.exe')) {
            throw "the uninstaller left nesva.exe behind"
          }
          if (Test-Path (Join-Path $target 'Uninstall.exe')) {
            throw "the uninstaller left itself behind"
          }

      - name: Smoke-test the package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path CMakeLists.txt -Pattern '^  VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $check = Join-Path $env:RUNNER_TEMP 'zip-check'
          Expand-Archive (Join-Path 'build/windows-msvc-release' "nesva-$version-windows-x86_64.zip") $check
          & (Join-Path $check 'nesva-cli.exe') --version
          foreach ($required in 'Qt6Core.dll', 'qwindows.dll', 'msvcp140.dll', 'vcruntime140.dll') {
            if (-not (Get-ChildItem $check -Filter $required -Recurse | Select-Object -First 1)) {
              throw "$required is missing from the package"
            }
          }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & (Join-Path $check 'nesva.exe') --data-dir (Join-Path $check 'data') --gui-selftest (Join-Path $check 'shots') --no-console-log

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem 'build/windows-msvc-release/nesva-*-windows-x86_64.zip','build/windows-msvc-release/nesva-*-windows-x86_64-setup.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content 'build/windows-msvc-release/SHA256SUMS-windows.txt'
          Get-Content 'build/windows-msvc-release/SHA256SUMS-windows.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: nesva-windows-x86_64
          path: |
            build/windows-msvc-release/nesva-*-windows-x86_64.zip
            build/windows-msvc-release/nesva-*-windows-x86_64-setup.exe
            build/windows-msvc-release/SHA256SUMS-windows.txt

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Collect assets
        run: |
          find assets -type f \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \
            -o -name '*-setup.exe' -o -name 'SHA256SUMS-*.txt' \) -exec cp {} . \;
          ls -l

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v$(grep -m1 '^  VERSION' CMakeLists.txt | awk '{print $2}')-candidate"
          fi
          # The notes live in CHANGELOG.md; the release body points at them rather
          # than inventing a second summary that drifts.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber ./*.deb ./*.tar.gz ./*.zip ./*-setup.exe ./SHA256SUMS-*.txt
          else
            gh release create "$tag" --title "Nesva $tag" --generate-notes \
              ./*.deb ./*.tar.gz ./*.zip ./*-setup.exe ./SHA256SUMS-*.txt
          fi
